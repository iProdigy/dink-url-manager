name = "dink-url-manager"
main = "src/worker.tsx"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dink-url-manager"
database_id = "2357bf90-d9b0-4eb4-b1a5-8c1457860579"
migrations_dir = "./migrations"

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[ratelimits]]
name = "CONFIG_CREATE_RATELIMIT"
namespace_id = "1001"
simple = { limit = 2, period = 10 }

[[ratelimits]]
name = "CONFIG_UPDATE_RATELIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 10 }

[[ratelimits]]
name = "WEBHOOK_SECRET_RATELIMIT"
namespace_id = "1003"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "WEBHOOK_IP_RATELIMIT"
namespace_id = "1004"
simple = { limit = 250, period = 10 }
